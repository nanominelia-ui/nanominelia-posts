name: reels
on:
  push:
    branches: [main]
    paths: ["tools/reel_batch.py", "tools/make_reel.py", "bgm/**"]
  schedule:
    - cron: "0 0 * * *"   # 毎日 09:00 JST: 新しい投稿の動画を作り、古い動画を削除
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q pillow numpy
      - run: python tools/reel_batch.py
      - run: |
          git config user.name "nanominelia-bot"
          git config user.email "nanominelia@gmail.com"
          git add -A public/videos
          git diff --cached --quiet || (git commit -m "Auto reels (build/cleanup)" && git push)

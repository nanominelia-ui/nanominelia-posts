name: style-samples
on:
  push:
    branches: [main]
    paths: ["requests/style_samples.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk && pip install -q pillow
      - run: mkdir -p fonts && (test -s fonts/Yomogi-Regular.ttf || curl -sL -o fonts/Yomogi-Regular.ttf https://github.com/google/fonts/raw/main/ofl/yomogi/Yomogi-Regular.ttf) || true
      - run: python tools/styles.py requests/style_samples.json
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - run: |
          git config user.name "nanominelia-bot"
          git config user.email "nanominelia@gmail.com"
          git add samples public/posts
          git diff --cached --quiet || (git commit -m "Auto style samples" && git push)
